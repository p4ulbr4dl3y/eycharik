name: ci

# Two events matter: a pull request and a push to `main`. A tag does not run this workflow — the
# release workflow promotes the digest of a commit that `main` already gated.
#
# Every job here is offline and deterministic: the extractive provider, hashing embeddings, a
# throwaway Postgres. A job that needs a paid provider lives in `evals.yml` and runs nightly.

on:
  push:
    branches: [main]
  pull_request:

# Nothing in this workflow publishes, tags, or comments. The default token is read-only so a
# compromised action cannot push a release.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ENVIRONMENT: local

jobs:
  api:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: onboarding
          POSTGRES_PASSWORD: onboarding
          POSTGRES_DB: onboarding
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U onboarding -d onboarding"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Two databases, because the guard in the Makefile means what it says: the tests get their
      # own schema and never share the one a migration step just built.
      DATABASE_URL: postgresql+asyncpg://onboarding:onboarding@localhost:5432/onboarding
      ONBOARDING_TEST_DATABASE: postgresql+asyncpg://onboarding:onboarding@localhost:5432/onboarding_test
      ADMIN_TOKENS: ci-recruiter:recruiter:rec-1,ci-hr:hr_admin:hr-1
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - run: uv sync --frozen
      - run: npm ci
        working-directory: apps/admin
      - name: Create the test database and migrate it
        run: |
          PGPASSWORD=onboarding psql -h localhost -U onboarding -d onboarding -v ON_ERROR_STOP=1 \
            -c 'create database onboarding_test'
          DATABASE_URL="$ONBOARDING_TEST_DATABASE" uv run alembic upgrade head
      - name: Migrate the application database
        run: uv run alembic upgrade head
      - name: The gate, exactly as README tells a reviewer to run it
        # `make doctor` is the preflight and `make verify` is the gate: lint, types, import
        # contracts, the docs checks, both test tiers with the coverage floor, and the cabinet. The
        # same two commands are in docs/checker.md, so CI and the reviewer cannot drift apart.
        # `verify` stays free of `doctor` because it only needs a database URL: someone without
        # Docker can still run the gate against a container they already have.
        run: make doctor
      - run: make verify
      - name: Migrations run from an empty database and come back
        run: |
          DATABASE_URL="$ONBOARDING_TEST_DATABASE" uv run alembic downgrade base
          DATABASE_URL="$ONBOARDING_TEST_DATABASE" uv run alembic upgrade head

  admin:
    name: admin bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/admin
    steps:
      # Lint, types and unit tests already run inside `make verify`. What is left is the one thing
      # that gate cannot prove: that the production bundle still builds.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - run: npm ci
      - run: npm run build

  e2e:
    name: cabinet (fixture)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - run: npm ci
      - uses: actions/cache@v6
        id: playwright
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/admin/package-lock.json') }}
      - if: steps.playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Keep the trace of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-trace
          path: apps/admin/test-results/**
          if-no-files-found: warn

  stack:
    name: cabinet (real stack)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # The demo is the honest fixture: default tokens, hashing embeddings, no network.
      ADMIN_TOKEN: dev-hr-token
      E2E_BASE_URL: http://127.0.0.1:3000
    steps:
      # The fixture run above proves the cabinet against an in-memory API. This one proves the
      # wiring the fixture cannot: nginx, the session cookie, the proxy, migrations and Postgres.
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - run: uv sync --frozen
      - run: npm ci
        working-directory: apps/admin
      - run: npx playwright install --with-deps chromium
        working-directory: apps/admin
      - name: Bring the stack up and prove the demo numbers
        run: ./scripts/verify_demo.sh
      - name: Drive the real cabinet through nginx, the api and postgres
        run: npm run e2e:stack
        working-directory: apps/admin
      - name: Dump the logs of a failed run
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Keep the trace of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-stack-trace
          path: apps/admin/test-results/**
          if-no-files-found: warn

  compose:
    name: compose config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Validate the production compose override
        run: |
          cat > .env.prod <<'ENV'
          IMAGE_PREFIX=ghcr.io/example/onboarding
          TAG=0000000000000000000000000000000000000000
          DOMAIN=example.com
          PUBLIC_URL=https://example.com
          POSTGRES_USER=onboarding
          POSTGRES_PASSWORD=onboarding
          POSTGRES_DB=onboarding
          DATABASE_URL=postgresql+asyncpg://onboarding:onboarding@postgres:5432/onboarding
          ENV
          docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod config -q
          rm -f .env.prod

  security:
    name: supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Every step here fails the build on a real finding. A scanner that only reports would be a
      # green light nobody reads, so `make security` is the same command a laptop runs.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - run: uv sync --frozen
      - run: npm ci
        working-directory: apps/admin
      - run: make security

  gate:
    name: gate-summary
    # One required check instead of six. A job that is legitimately skipped leaves its own check
    # pending forever, and a merge then waits on a ghost; this job always runs and speaks for all.
    needs: [api, admin, e2e, stack, compose, security]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail when any job failed, was cancelled, or was skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "a required job did not succeed: ${{ toJSON(needs) }}" >&2
          exit 1
      - run: echo "all required jobs passed"
