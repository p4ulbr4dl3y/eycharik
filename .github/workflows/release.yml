name: release

# Two verbs, and neither one compiles anything twice.
#
#  - a push to `main` runs `build`: one image per commit, tagged `sha-<sha>`, with provenance and an
#    SBOM. That tag never moves, so it is what a rollback names.
#  - a `v*` tag runs `promote`: the *same digest* under a version tag. Nothing is rebuilt, so a
#    version cannot contain code that was never on `main`. A human pushes that tag; no bot does.
#
# A manual dispatch promotes an arbitrary ref, which lets an operator re-tag a commit that already
# has an image. If the image is missing the run fails and says which commit to merge first.
#
# `latest` is deliberately not published: a release that cannot name its commit cannot be rolled
# back, and the deploy workflow consumes the commit SHA.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref (tag, branch, or commit SHA) to promote
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: build ${{ matrix.name }}
    if: github.event_name == 'push' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - name: api
            context: .
            file: Dockerfile
          - name: admin
            context: apps/admin
            file: apps/admin/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - name: Resolve the commit
        id: rev
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Lowercase the image prefix
        id: image
        run: echo "prefix=$(printf '%s' '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          # The cabinet's context has no `.git`, so the commit arrives as a build argument.
          build-args: |
            VITE_BUILD_ID=${{ steps.rev.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.rev.outputs.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.prefix }}-${{ matrix.name }}:sha-${{ steps.rev.outputs.sha }}
      - name: Report the vulnerabilities of the image we just published
        # Reporting, not gating: a scanner that blocks on day one blocks on the base image, not on
        # our code. It becomes a gate when a baseline of accepted findings exists. See ADR 0028.
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.image.outputs.prefix }}-${{ matrix.name }}:sha-${{ steps.rev.outputs.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "0"

  promote:
    name: promote ${{ github.ref_name }}
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_type == 'tag')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.rev.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0
      - name: Resolve the commit
        id: rev
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Decide the version
        id: version
        env:
          REF_NAME: ${{ github.event.inputs.ref || github.ref_name }}
        run: |
          version=$(python3 scripts/release_version.py --ref "$REF_NAME")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "promoting $REF_NAME as $version"
      - name: Lowercase the image prefix
        id: image
        run: echo "prefix=$(printf '%s' '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the digest of ${{ steps.rev.outputs.sha }} to ${{ steps.version.outputs.version }}
        env:
          SHA: ${{ steps.rev.outputs.sha }}
          VERSION: ${{ steps.version.outputs.version }}
          PREFIX: ${{ env.REGISTRY }}/${{ steps.image.outputs.prefix }}
        run: |
          set -euo pipefail
          for name in api admin; do
            source="$PREFIX-$name:sha-$SHA"
            if ! docker buildx imagetools inspect "$source" >/dev/null 2>&1; then
              echo "$source is not in the registry: push this commit to main first, or promote a commit the build already published" >&2
              exit 1
            fi
            docker buildx imagetools create --tag "$PREFIX-$name:$VERSION" "$source"
            echo "$name: $VERSION -> $(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$PREFIX-$name:$VERSION")"
          done
      - name: Record what was released
        run: |
          {
            echo "### release ${{ steps.version.outputs.version }}"
            echo
            echo "- commit: \`${{ steps.rev.outputs.sha }}\`"
            echo "- images: \`${{ steps.image.outputs.prefix }}-{api,admin}:${{ steps.version.outputs.version }}\`"
            echo "- built by: the \`build\` job of the \`main\` push that published this digest"
            echo "- provenance and SBOM: attached by \`build\`; nothing was rebuilt here"
          } >> "$GITHUB_STEP_SUMMARY"
