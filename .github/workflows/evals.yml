name: evals

# Two tiers, and the cheap one is the default, mirroring `make test` versus `make test-live`.
# The cheap tier runs on every pull request and spends nothing: it validates the set against its
# contract and proves that each gate can fail. The nightly tier spends a few rubles and records a
# measurement, because a quality claim needs a commit, a command, and an environment.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cheap:
    name: contract and gate power
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint, types, offline tests
        run: make lint types arch test docs
      - name: The set matches its contract and every gate has a mutant
        run: make eval-lint

  live:
    name: retrieval eval against a real index
    # A fork cannot read the secrets, and a scheduled run is the only place a provider key is used.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: cheap
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: onboarding
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/onboarding
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
      EMBED_PROVIDER: ${{ vars.EMBED_PROVIDER }}
      HTTPS_PROXY: ${{ secrets.HTTPS_PROXY }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Migrate and ingest the corpus
        run: |
          make migrate
          make ingest
      - name: Retrieval eval against the pinned gates
        # The gates live in docs/evals/baseline.json; --compare takes a JSONL artifact, not a gate
        # file, and the nightly run has no earlier artifact to pair against.
        run: make eval-retrieval
      - name: Full eval with generation
        run: make eval ARGS="--note nightly run in CI"
      - name: Upload the measurement and its artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: measurement-${{ github.run_id }}
          path: |
            docs/measurements/*.md
            docs/measurements/*.jsonl
          if-no-files-found: warn
