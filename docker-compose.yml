# Local and demo topology. One backend image, four roles, plus the static cabinet.
name: onboarding

# Local/demo defaults. A fresh compose stack is empty: migrations run, but nothing is seeded.
# Run `make demo-data` to fill it and `make demo-data-del` to return to the empty state.
# These are defaults only; an explicit .env or shell variable wins.
x-local-demo: &local-demo
  ENVIRONMENT: ${ENVIRONMENT:-local}
  CHANNELS: ${CHANNELS:-max}
  MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-demo-token}
  MAX_WEBHOOK_SECRET: ${MAX_WEBHOOK_SECRET:-dev-secret}
  LLM_PROVIDER: ${LLM_PROVIDER:-extractive}
  EMBED_PROVIDER: ${EMBED_PROVIDER:-hashing}
  EMBED_PROFILE: ${EMBED_PROFILE:-local-hashing}
  EMBED_DIM: ${EMBED_DIM:-1024}
  EXTRACTION_PROFILE: ${EXTRACTION_PROFILE:-native}
  SENTIMENT_PROVIDER: ${SENTIMENT_PROVIDER:-prompt}
  ADMIN_TOKENS: "${ADMIN_TOKENS:-dev-recruiter-token:recruiter:rec-1,dev-manager-token:manager:Коммерческий блок,dev-hr-token:hr_admin:hr-1:2030-12-31}"
  DATA_RETENTION_DAYS: ${DATA_RETENTION_DAYS:-365}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-onboarding}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-onboarding}
      POSTGRES_DB: ${POSTGRES_DB:-onboarding}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-onboarding}"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    env_file:
      - path: .env
        required: false
    environment:
      <<: *local-demo
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-onboarding}:${POSTGRES_PASSWORD:-onboarding}@postgres:5432/${POSTGRES_DB:-onboarding}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    healthcheck:
      disable: true

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      <<: *local-demo
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-onboarding}:${POSTGRES_PASSWORD:-onboarding}@postgres:5432/${POSTGRES_DB:-onboarding}
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "-m", "onboarding.app.worker.main"]
    env_file:
      - path: .env
        required: false
    environment:
      <<: *local-demo
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-onboarding}:${POSTGRES_PASSWORD:-onboarding}@postgres:5432/${POSTGRES_DB:-onboarding}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      disable: true

  admin:
    build: apps/admin
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARE_TUNNEL_TOKEN:-}"]
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres-data:
